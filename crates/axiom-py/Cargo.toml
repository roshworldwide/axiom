[package]
name = "axiom-py"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for the Axiom CRDT runtime."
publish = false

[workspace]

[lib]
name = "axiom"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
rmp-serde = "1.3.1"
axiom-core = { path = "../axiom-core" }
