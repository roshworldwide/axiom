name: Nightly heavy checks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  large-tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run the large-scale TLC sweep
        env:
          XMX: "13g"
        run: |
          bash evaluation/large_run.sh | tee large_run_ci.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-run-report
          path: large_run_ci.md

  proptest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Full property-test run (PROPTEST_CASES=2000 -> 62,000 cases)
        env:
          PROPTEST_CASES: "2000"
        run: cargo test --workspace --release
